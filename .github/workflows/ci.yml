name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -q
        env:
          # Suite determinista: sin modelos pesados ni red
          RAG_EMBEDDING_PROVIDER: hash
          RAG_STORE_PROVIDER: memory
          RAG_LLM_PROVIDER: echo

      - name: Smoke import
        run: python -c "import universal_rag; print(universal_rag.__version__)"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t universal-rag:ci .

      - name: "Smoke: el contenedor arranca y responde /health"
        run: |
          docker run -d --name rag-smoke -p 8100:8100 universal-rag:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8100/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          curl -sf http://localhost:8100/stats > /dev/null
          docker rm -f rag-smoke > /dev/null
